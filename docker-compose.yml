version: "3.9"

services:
  # --- FastAPI Backend ---
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: contractiq-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./agents:/app/agents
      - ./graph:/app/graph
      - ./gateway:/app/gateway
      - ./rag:/app/rag
      - ./uploads:/app/uploads
      - ./chroma_data:/app/chroma_data
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  # --- Streamlit Frontend ---
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: contractiq-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app/frontend
      - ./.streamlit:/app/.streamlit
    depends_on:
      - backend
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
